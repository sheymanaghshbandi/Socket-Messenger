version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build:
      context: "./Final structure"
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: chatdb
      DB_USER: chatuser
      DB_PASS: chatpass
    depends_on:
      - db
    ports:
      - "5050:5050"

volumes:
  dbdata:
